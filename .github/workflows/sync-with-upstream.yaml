# references:
# - https://stackoverflow.com/questions/23793062/can-forks-be-synced-automatically-in-github
# - https://stackoverflow.com/questions/10312521/how-to-fetch-all-git-branches

name: Sync origin with upstream
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
jobs:
  sync-with-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.OTP_WORKFLOW_TOKEN }}
      - name: Sync upstream
        run: |
          git config --global user.name 'jaydoane'
          git config --global user.email 'jaydoane@users.noreply.github.com'

          # "git checkout master" is unnecessary, already here by default
          git pull --unshallow  # this option is very important, you would get
                                # complaints about unrelated histories without it.
                                # (but actions/checkout@v2 can also be instructed
                                # to fetch all git depth right from the start)

          git remote add upstream https://github.com/erlang/otp.git
          git fetch --all

          git push --mirror https://github.com/jaydoane/otp.git
